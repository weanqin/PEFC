# Model Registry — checkpoint version + status index
# 生成于迁移任务 08-01-migrate-to-latent-flow (2026-08-01)。
# 每个 checkpoint 标注 version / status / fold / dataset，便于调用方判断是否过时。
# status: active (当前 SOTA/在用) | superseded (被更新版取代，留作复现) | deprecated (ADR-0004 弃用，勿用于新工作)
# 规范见 .trellis/spec/experiments/registry.md

# =============================================================================
# ACTIVE — OC-LatentFlow 主模型 (MODMA)
# 当前 SOTA: fold2 r_abs(GC)=0.585 (mexhat screg l0.01 w0.1 nosc 变体)
# =============================================================================

- name: oc_latent_flow_vae
  version: v1.0.0
  ckpt: checkpoints/fold{0-4}_oc_latent_flow_vae_best.pt
  stage: stage1
  dataset: modma
  fold: 0-4
  status: active
  notes: "Stage-1 VAE (encoder+proj+decoder), 5 folds 完整"

- name: oc_latent_flow_flow
  version: v1.0.0
  ckpt: checkpoints/fold{0-4}_oc_latent_flow_flow_best_graph_mexhat_screg_l0.01_w0.1.pt
  stage: stage2
  dataset: modma
  fold: 0-4
  status: active
  variant: graph_mexhat_screg_l0.01_w0.1
  notes: "Stage-2 flow, mexhat graph-mixer + SC-reg, 5 folds ablation 主线"

- name: oc_latent_flow_flow_ablation
  version: v1.0.0
  ckpts:
    - checkpoints/fold{0-4}_oc_latent_flow_flow_best_graph_mexhat_screg_l0.01_w0.1_nomexhat.pt
    - checkpoints/fold{0-4}_oc_latent_flow_flow_best_graph_mexhat_screg_l0.01_w0.1_nosc.pt
    - checkpoints/fold{0-4}_oc_latent_flow_flow_best_graph_mexhat_screg_l0.01_w0.1_now.pt
  stage: stage2
  dataset: modma
  fold: 0-4
  status: superseded
  notes: "组件消融 (nomexhat/nosc/now), 用于定位 channel-selectivity 根因 (task 06-29)"

